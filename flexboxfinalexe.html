            }
            .profile-picture {
                height: 60px;
                width: 60px;
                object-fit: cover;
                border-radius: 30px;
            }
            .description {
                margin-bottom: 10px;
            }
            .description, .youtube-link {

            }
            .channel-name {
                font-weight: bold;
            }

            }

                border-style: solid;

                justify-content: space-between;

            }
            .youtube-link-firstdiv {

                height: 79px;
            }
           

            
        </style>

        <div class="outer-div">

            <div>

                    <p>What is backend web development? A complete overview.New video is up!</p>
                </div>

                <div class="youtube-link-firstdiv">right section</div>
                <div class="youtube-link">youtube.com
                    <p class="down-youtube.com">Backend web development - a complete overview (2021)</p>

            </div>

         
            
            
        </div>
