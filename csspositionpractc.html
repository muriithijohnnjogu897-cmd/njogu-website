<!DOCTYPE html>
<html>
    <head>
        <title>css position exercise</title>
    </head>

    <style>
        .header {
            display: flex;
            align-items: center;
            border-style: solid;
            border-width: 1px;
            border-color: rgb(209, 207, 207);
            height: 50px;
            width: 100%;
            max-width: 800px;
        }

       
        .profile-picture {
            height: 30px;
            width: 30px;
            border-radius: 15px;
        }
        .userName {
            font-weight: bold;
            margin-left: 10px;
        }
        .div2 {
            display: flex;
            margin-left: 200px;
            

        }
        .profile-content {
            display: flex;
            align-items: center;
            padding-left: 30px;
        }
        .add-friend {
            margin-right: 5px;
        }
        .message {
            margin-left: 5px;
        }
        .add-friend-button {
            height: 25px;
            background-color: rgb(6, 6, 229);
            color: white;
            border: none;
            border-radius: 5px;
        }
        .message-button {
            height: 25px;
            background-color: rgb(219, 217, 217);
            border: none;
            font-weight: bold;
        }
     
    
    </style>


    <body>
        <div class="header">

            <div class="profile-content">
             <div class="profile"> <img class="profile-picture" src="thumbnails/s-l1600.webp">  </div>
            <div class="userName">Oliver John</div>
            </div>
       

                  
            <div class="div2">
             <div class="add-friend"> <button class="add-friend-button">Add friend</button></div>
            <div class="message"> <button class="message-button">Message</button></div>
            </div>

     
        </div>

  

    </body>
</html>
