<!DOCTYPE html>
<html>
    <head>
        <title>A tweet-box</title>
        <style>
            .profile {
                height: 60px;
                width: 60px;
                border-radius: 30px;

            }
            .div1 {
                border-radius: 5px;
                display: flex;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 10px;
                box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
                margin-top: 50px;
                background-color: white;



            }
            .inp {
                border: none;
                
             }
             .btn {
                height: 30px;
                width: 80px;
                border-radius: 40px;
                border: none;
                background-color: rgb(29, 29, 224);
                color: white;
                margin-top: 10px;
                margin-left: 200px;
             }
        </style>
    </head>
    <body>
        <div class="div1">
           <img class="profile" src="thumbnails/s-l1600 (1).webp"> 
           <input class="inp" type="text" placeholder="What's happening">
           <button class="btn">Tweet</button>

        </div>

    </body>
</html>
